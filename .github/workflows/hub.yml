name: Hub

on:
  push:
    paths:
      - 'hub/**'
      - 'deploy/**'
      - 'docs/events.md'
      - '.github/workflows/hub.yml'
  pull_request:
    paths:
      - 'hub/**'
      - 'deploy/**'
      - 'docs/events.md'
      - '.github/workflows/hub.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub

    # Real MariaDB for the tests (same credentials as deploy/docker-compose.dev.yml)
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: wtc_lodestone
          MARIADB_USER: lodestone
          MARIADB_PASSWORD: lodestone
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Builds the dashboard (Node is downloaded by the node-gradle plugin),
      # compiles the hub and runs the tests
      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload hub jar
        uses: actions/upload-artifact@v4
        with:
          name: wtc_lodestone-hub
          path: |
            hub/build/libs/*.jar
            !hub/build/libs/*-plain.jar
          if-no-files-found: error