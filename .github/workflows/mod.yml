name: Mod

on:
  push:
    paths:
      - 'mod/**'
      - '.github/workflows/mod.yml'
  pull_request:
    paths:
      - 'mod/**'
      - '.github/workflows/mod.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 17 for the forge-1.20.1 jar, 21 for neoforge's and Gradle itself (the last one listed is the default)
      - name: Setup JDK 17 and 21
        uses: actions/setup-java@v4
        with:
          java-version: |
            17
            21
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload mod jars
        uses: actions/upload-artifact@v4
        with:
          name: wtc_lodestone-mod
          # one jar per loader subproject; forge-1.20.1's dev (unobfuscated) jar sits in build/devlibs instead
          path: mod/*/build/libs/*.jar
          if-no-files-found: error