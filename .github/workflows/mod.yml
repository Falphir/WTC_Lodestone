name: Mod

on:
  push:
    paths:
      - 'mod/**'
      - 'docs/events.md'
      - '.github/workflows/mod.yml'
  pull_request:
    paths:
      - 'mod/**'
      - 'docs/events.md'
      - '.github/workflows/mod.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: wtc_lodestone-mod
          path: mod/build/libs/*.jar
          if-no-files-found: error