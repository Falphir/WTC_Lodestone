# The only public door to the box's Lodestone services.
#   sudo cp deploy/nginx/lodestone.conf /etc/nginx/sites-available/lodestone
#   sudo ln -s /etc/nginx/sites-available/lodestone /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Then `sudo certbot --nginx -d <your-host>` adds the 443 server block and the redirect itself.
# Replace both occurrences of <your-host> first (e.g. 203-0-113-7.sslip.io).

server {
    listen 80;
    listen [::]:80;
    server_name <your-host>;

    # The dashboard is served from inside the hub jar, so everything is one upstream.
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The dashboard's live socket (config/LiveUpdates). Needs the upgrade headers, and a read
    # timeout longer than nginx's 60s default -- it is deliberately silent between hub events,
    # and a dropped socket means every open dashboard falls back to polling until it reconnects.
    location /api/admin/live {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
