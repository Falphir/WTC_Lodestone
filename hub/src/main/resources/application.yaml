spring:
  application:
    name: wtc-lodestone-hub
  datasource:
    url: jdbc:mariadb://localhost:3306/wtc_lodestone
    username: lodestone
    password: lodestone
    # MariaDB defaults to REPEATABLE READ, and from 11.8 with innodb_snapshot_isolation on, which
    # refuses to update a row another transaction changed since this one read it ("Record has
    # changed since last read"). Servers write their own row from several requests at once, and
    # each transaction here is short, so read-committed is the right level.
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jpa:
    hibernate:
      jdbc:
        time_zone: UTC
      ddl-auto: validate
    open-in-view: false
  web:
    error:
      # include ResponseStatusException reasons (e.g. "No Minecraft account named ...") in error responses
      include-message: always

lodestone:
  admins:
    - username: admin
      password: ${LODESTONE_ADMIN_PASSWORD:admin}
    # Service account for the Discord bot (discord/) -- it signs in and uses the whitelist
    # API exactly like a dashboard admin, see discord/README.md "Hub account".
    - username: discord-bot
      password: ${LODESTONE_BOT_PASSWORD:bot}
  # Signs admin tokens. Set it (LODESTONE_JWT_SECRET) to keep admins signed in across a hub
  # restart -- any passphrase, it is hashed to the right length. Unset means a new key each boot,
  # so every admin is signed out on restart.
  jwt-secret: ${LODESTONE_JWT_SECRET:}
  # Optional. The hub's way into PufferPanel (2.7.x): the panel's address and an OAuth2 client made
  # under an admin account's settings there. Leave any blank and the hub never calls it. Spelled out
  # here because relaxed binding alone would want LODESTONE_PUFFERPANEL_CLIENTID, no underscore.
  pufferpanel:
    url: ${LODESTONE_PUFFERPANEL_URL:}
    client-id: ${LODESTONE_PUFFERPANEL_CLIENT_ID:}
    client-secret: ${LODESTONE_PUFFERPANEL_CLIENT_SECRET:}
    # The hub's address as a game server reaches it, written into servers created from the dashboard
    # (e.g. http://127.0.0.1:8081 on the game box, http://host.docker.internal:8080 for a Docker panel).
    server-hub-url: ${LODESTONE_PUFFERPANEL_SERVER_HUB_URL:}
  # CurseForge API key (console.curseforge.com), for picking a modpack when creating a server.
  # Blank leaves that step out of the dashboard.
  curseforge:
    api-key: ${LODESTONE_CURSEFORGE_API_KEY:}
  heartbeat-retention-days: 7
  # how often servers report; the mod learns it on check-in, the dashboard from /api/info
  heartbeat-interval-seconds: 60
  # how often servers poll the whitelist, apart from heartbeats: a poll stores nothing and stirs no
  # dashboard, so it can be quick. Also learned on check-in, so servers pick a change up on restart.
  whitelist-sync-interval-seconds: 10
