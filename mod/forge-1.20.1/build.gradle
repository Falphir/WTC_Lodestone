plugins {
    id 'net.neoforged.moddev.legacyforge' // version in the root build.gradle
    id 'idea'
}

base {
    archivesName = "${mod_id}-forge-${forge_minecraft_version}"
}

// 1.20.1 runs on Java 17, so this jar is built for it; the common/ sources stay within 17 because of it.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// The same loader-free core as neoforge/ compiles, compiled into this jar too (see neoforge/build.gradle).
sourceSets.main.java.srcDir '../common/src/main/java'
sourceSets.test.java.srcDir '../common/src/test/java'

repositories {
    mavenCentral()
}

dependencies {
    // Forge 1.20.1 runs with SRG names, so a mixin needs a refmap from Mojang's names to them; the
    // processor writes it while compiling (see the mixin block below)
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

legacyForge {
    version = "${forge_minecraft_version}-${forge_version}"

    // NeoForge's plugin finds META-INF/accesstransformer.cfg by itself; the legacy one is told
    accessTransformers {
        from 'src/main/resources/META-INF/accesstransformer.cfg'
    }
    validateAccessTransformers = true

    parchment {
        mappingsVersion = project.forge_parchment_mappings_version
        minecraftVersion = project.forge_minecraft_version
    }

    // Server-side only, like neoforge/; its own folder, since a 1.20.1 world can't share 1.21.1's.
    runs {
        server {
            server()
            programArgument '--nogui'
            gameDirectory = project.file('../run-forge-1.20.1')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

// Forge 1.20.1's mods.toml has no [[mixins]]: it finds a mod's mixins through this manifest entry.
tasks.named('jar', Jar) {
    manifest.attributes(['MixinConfigs': "${mod_id}.mixins.json"])
}

// Expands ${...} in the metadata template, so the versions live only in gradle.properties.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: forge_minecraft_version_range,
            loader_version_range   : forge_loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
