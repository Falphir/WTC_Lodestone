# The Forge 1.20.1 build's metadata; neoforge/ has its own. The placeholders are filled in from
# gradle.properties (see generateModMetadata in build.gradle), so change versions there, never here.

modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Falphir/WTC_Lodestone/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
# Server-only mod: clients without it can still join
displayTest="IGNORE_SERVER_VERSION"
displayURL="https://github.com/Falphir/WTC_Lodestone"
authors="Falphir"
description='''
Server-side bridge that connects WTC Network servers to the WTC Lodestone hub for cross-server presence, events and announcements.
'''

# No [[mixins]] here: Forge 1.20.1 reads the mixin config from the jar's MixinConfigs manifest entry.
# The access transformer is found at META-INF/accesstransformer.cfg without a mention here.

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    # any Forge for 1.20.1, not just the one it's built against: the mod uses nothing newer
    versionRange="${loader_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
