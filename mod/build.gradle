// The loader subprojects hold the real builds; this only carries what they share.

// Both ModDevGradle plugins, at one version, declared here so the two subprojects load them from
// one classloader: legacyforge runs on top of moddev and is released alongside it.
plugins {
    id 'net.neoforged.moddev' version '2.0.147' apply false
    id 'net.neoforged.moddev.legacyforge' version '2.0.147' apply false
}

subprojects {
    apply plugin: 'java-library'

    version = mod_version
    group = mod_group_id

    // Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21. A subproject for an
    // older Minecraft sets its own (forge-1.20.1 is on 17).
    java.toolchain.languageVersion = JavaLanguageVersion.of(21)

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}
